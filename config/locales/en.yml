---
en:
  activerecord:
    errors:
      messages:
        record_invalid: "Validation failed: %{errors}"
        restrict_dependent_destroy:
          has_one: "Cannot delete because %{record} exists"
          has_many: "Cannot delete because %{record} exists"
  date:
    abbr_day_names:
      - Sun
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
    abbr_month_names:
      - 
      - Jan
      - Feb
      - Mar
      - Apr
      - May
      - Jun
      - Jul
      - Aug
      - Sep
      - Oct
      - Nov
      - Dec
    day_names:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    formats:
      default: "%Y/%m/%d"
      long: "%A, %B %d, %Y"
      short: "%b %d"
    month_names:
      - 
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    order:
      - :year
      - :month
      - :day
  datetime:
    distance_in_words:
      about_x_hours: "about %{count} hours"
      about_x_months: "about %{count} months"
      about_x_years: "about %{count} years"
      almost_x_years: "almost %{count} years"
      half_a_minute: "half a minute"
      less_than_x_seconds: "less than %{count} seconds"
      less_than_x_minutes: "less than %{count} minutes"
      over_x_years: "over %{count} years"
      x_seconds: "%{count} seconds"
      x_minutes: "%{count} minutes"
      x_days: "%{count} days"
      x_months: "%{count} months"
      x_years: "%{count} years"
    prompts:
      second: Second
      minute: Minute
      hour: Hour
      day: Day
      month: Month
      year: Year
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "must be accepted"
      blank: "can't be blank"
      confirmation: "doesn't match %{attribute}"
      empty: "can't be empty"
      equal_to: "must be equal to %{count}"
      even: "must be even"
      exclusion: "is reserved"
      greater_than: "must be greater than %{count}"
      greater_than_or_equal_to: "must be greater than or equal to %{count}"
      in: "must be in %{count}"
      inclusion: "is not included in the list"
      invalid: "is invalid"
      less_than: "must be less than %{count}"
      less_than_or_equal_to: "must be less than or equal to %{count}"
      model_invalid: "Validation failed: %{errors}"
      not_a_number: "is not a number"
      not_an_integer: "must be an integer"
      odd: "must be odd"
      other_than: "must be other than %{count}"
      password_too_long: "is too long"
      present: "must be blank"
      required: "is required"
      taken: "has already been taken"
      too_long: "is too long (maximum is %{count} characters)"
      too_short: "is too short (minimum is %{count} characters)"
      wrong_length: "is the wrong length (should be %{count} characters)"
    template:
      body: "Please check the following fields:"
      header: "%{model} has %{count} errors"
  helpers:
    select:
      prompt: "Please select"
    submit:
      create: "Create"
      submit: "Save"
      update: "Update"
  number:
    currency:
      format:
        delimiter: ","
        format: "%n%u"
        precision: 2
        separator: "."
        significant: false
        strip_insignificant_zeros: false
        unit: "$"
    format:
      delimiter: ","
      precision: 3
      round_mode: default
      separator: "."
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: Billion
          million: Million
          quadrillion: Quadrillion
          thousand: Thousand
          trillion: Trillion
          unit: ''
      format:
        delimiter: ''
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n%u"
        units:
          byte: Byte
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
    percentage:
      format:
        delimiter: ''
        format: "%n%"
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: ", "
      two_words_connector: ", "
      words_connector: ", "
  time:
    am: AM
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      long: "%B %d, %Y %H:%M"
      short: "%b %d %H:%M"
    pm: PM
